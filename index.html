<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bounce Firmware Control</title>
</head>
<body>
<style>
  :root{
    --bg:#0E1520;
    --panel:#141C29;
    --panel-2:#182233;
    --border:#253244;
    --border-soft:#1D2836;
    --text:#DCE4EE;
    --text-dim:#7C8AA0;
    --text-faint:#4E5A6E;
    --mono: ui-monospace, "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
    --sans: -apple-system, "Inter", "Segoe UI", Roboto, sans-serif;

    --draft:#6B7686;      --draft-bg:#1C222C;
    --validation:#D99A3D; --validation-bg:#2B2213;
    --approved:#3FB68B;   --approved-bg:#122A24;
    --deployed:#4C8DFF;   --deployed-bg:#101F35;
    --deprecated:#5B6779; --deprecated-bg:#181E27;
    --rejected:#E5636B;   --rejected-bg:#2A1418;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text); font-family:var(--sans);
    font-size:14px; -webkit-font-smoothing:antialiased;
  }
  #app{display:flex; min-height:600px; height:100%;}

  /* ---- rail ---- */
  .rail{
    width:190px; flex-shrink:0; background:var(--panel); border-right:1px solid var(--border-soft);
    padding:18px 0; display:flex; flex-direction:column; gap:2px;
  }
  .rail-title{
    font-size:11px; letter-spacing:.06em; color:var(--text-faint); padding:0 18px 12px;
    text-transform:uppercase; font-weight:600;
  }
  .rail-item{
    padding:9px 18px; cursor:pointer; color:var(--text-dim); font-size:13.5px;
    border-left:2px solid transparent; display:flex; justify-content:space-between; align-items:center;
  }
  .rail-item:hover{ color:var(--text); background:var(--panel-2); }
  .rail-item.active{ color:var(--text); background:var(--panel-2); border-left-color:var(--deployed); }
  .rail-count{ font-family:var(--mono); font-size:11px; color:var(--text-faint); margin-left:8px; }
  .rail-sep{ height:1px; background:var(--border-soft); margin:12px 18px; }

  /* ---- main ---- */
  .main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .topbar{
    display:flex; align-items:center; gap:12px; padding:16px 14px; border-bottom:1px solid var(--border-soft);
    background:var(--panel);
  }
  .topbar h1{ font-size:16px; margin:0; font-weight:600; letter-spacing:.01em; }
  .topbar .sub{ color:var(--text-faint); font-size:12px; margin-left:2px;}
  .spacer{ flex:1; }
  input[type=text], select{
    background:var(--bg); border:1px solid var(--border); color:var(--text);
    border-radius:6px; padding:7px 10px; font-size:13px; font-family:var(--sans); outline:none;
  }
  input[type=text]:focus, select:focus{ border-color:var(--deployed); }
  .btn{
    background:var(--deployed); color:#08111F; border:none; border-radius:6px; padding:8px 14px;
    font-size:13px; font-weight:600; cursor:pointer; font-family:var(--sans);
  }
  .btn:hover{ filter:brightness(1.08); }
  .btn-ghost{
    background:transparent; border:1px solid var(--border); color:var(--text-dim);
    border-radius:6px; padding:7px 12px; font-size:12.5px; cursor:pointer; font-family:var(--sans);
  }
  .btn-ghost:hover{ color:var(--text); border-color:var(--text-dim); }

  .content{ flex:1; overflow:auto; padding:22px; }

  /* ---- responsive ---- */
  @media (max-width: 760px){
    #app{ flex-direction:column; height:auto; min-height:100vh; }
    .rail{
      width:100%; flex-direction:row; flex-wrap:wrap; padding:10px 12px; gap:6px 4px;
      border-right:none; border-bottom:1px solid var(--border-soft); align-items:center;
    }
    .rail-title{ padding:0 6px 0 0; white-space:nowrap; flex-basis:100%; }
    .rail-title ~ .rail-title{ margin-top:4px; }
    .rail-sep{ display:none; }
    .rail-item{ white-space:nowrap; border-left:none; border-bottom:2px solid transparent; padding:6px 10px; }
    .rail-item.active{ border-left-color:transparent; border-bottom-color:var(--deployed); }
    .topbar{ flex-wrap:wrap; row-gap:8px; }
    .topbar h1, .topbar .sub{ flex:0 0 auto; }
    #search{ flex:1 1 100%; order:5; }
    .role-badge{ order:1; margin-left:auto; }
    .content{ padding:14px; }
    table{ font-size:12px; }
    th, td{ padding:8px 8px; }
  }

  /* ---- dashboard ---- */
  .cards{ display:grid; grid-template-columns:repeat(6,1fr); gap:12px; margin-bottom:24px; }
  .card{ background:var(--panel); border:1px solid var(--border-soft); border-radius:8px; padding:14px 16px; }
  .card .num{ font-family:var(--mono); font-size:26px; font-weight:600; }
  .card .lbl{ font-size:12px; color:var(--text-dim); margin-top:2px; }

  .section-title{ font-size:13px; font-weight:600; color:var(--text-dim); text-transform:uppercase; letter-spacing:.05em; margin:0 0 10px; }

  /* ---- matrix ---- */
  table{ width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--border-soft); border-radius:8px; overflow:hidden;}
  th{ text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-faint); padding:10px 12px; border-bottom:1px solid var(--border-soft); background:var(--panel-2);}
  td{ padding:10px 12px; border-bottom:1px solid var(--border-soft); font-size:13px; }
  tr:last-child td{ border-bottom:none; }
  tr.row:hover{ background:var(--panel-2); cursor:pointer; }
  .matrix-table td, .matrix-table th{ text-align:center; }
  .matrix-table td:first-child, .matrix-table th:first-child{ text-align:left; }

  .mono{ font-family:var(--mono); }
  .dim{ color:var(--text-dim); }
  .faint{ color:var(--text-faint); }

  .pill{
    display:inline-block; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:600;
    font-family:var(--sans); letter-spacing:.01em;
  }
  .pill.draft{ color:var(--draft); background:var(--draft-bg); }
  .pill.validation{ color:var(--validation); background:var(--validation-bg); }
  .pill.approved{ color:var(--approved); background:var(--approved-bg); }
  .pill.deployed{ color:var(--deployed); background:var(--deployed-bg); }
  .pill.deprecated{ color:var(--deprecated); background:var(--deprecated-bg); }
  .pill.rejected{ color:var(--rejected); background:var(--rejected-bg); }
  .pill.dash{ color:var(--text-faint); background:var(--panel-2); }

  .chip{
    display:inline-block; padding:2px 8px; border-radius:4px; font-size:11px; font-family:var(--mono);
    background:var(--panel-2); color:var(--text-dim); border:1px solid var(--border-soft); margin-right:4px;
  }

  .empty{ text-align:center; padding:60px 20px; color:var(--text-faint); }
  .empty .big{ font-size:15px; color:var(--text-dim); margin-bottom:6px; }

  /* ---- drawer ---- */
  .overlay{
    position:fixed; inset:0; background:rgba(4,7,12,.55); display:none; align-items:stretch; justify-content:flex-end; z-index:50;
  }
  .overlay.open{ display:flex; }
  .drawer{
    width:460px; max-width:92vw; background:var(--panel); border-left:1px solid var(--border); height:100%;
    overflow:auto; padding:22px;
  }
  .drawer h2{ font-size:16px; margin:0 0 2px; font-family:var(--mono); }
  .drawer .drawer-sub{ color:var(--text-dim); font-size:12.5px; margin-bottom:16px; }
  .field-row{ display:flex; gap:10px; margin-bottom:10px; }
  .field{ flex:1; }
  .field label{ display:block; font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.04em; margin-bottom:4px; }
  .field-static{ font-size:13px; padding:7px 0; }
  textarea{
    width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text); border-radius:6px;
    padding:8px 10px; font-size:13px; font-family:var(--sans); resize:vertical; min-height:60px; outline:none;
  }
  textarea:focus{ border-color:var(--deployed); }
  .divider{ height:1px; background:var(--border-soft); margin:16px 0; }
  .action-row{ display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .history-item{ font-size:12.5px; padding:8px 0; border-bottom:1px solid var(--border-soft); }
  .history-item:last-child{ border-bottom:none; }
  .history-top{ display:flex; justify-content:space-between; color:var(--text-dim); }
  .history-note{ margin-top:3px; color:var(--text-dim); }
  .deploy-item{ display:flex; justify-content:space-between; font-size:12.5px; padding:6px 0; border-bottom:1px solid var(--border-soft); }
  .deploy-item:last-child{ border-bottom:none; }
  .close-x{ position:absolute; top:18px; right:18px; background:none; border:none; color:var(--text-faint); font-size:18px; cursor:pointer; }
  .drawer{ position:relative; }

  /* ---- modal (new firmware) ---- */
  .modal{
    width:520px; max-width:92vw; background:var(--panel); border:1px solid var(--border); border-radius:10px;
    padding:22px; margin:auto;
  }
  .modal h2{ margin:0 0 16px; font-size:15px; }
  .modal-overlay{ align-items:center; justify-content:center; }
  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px; }
  .form-grid .full{ grid-column:1/3; }
  .form-field label{ display:block; font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.04em; margin-bottom:4px; }
  .form-field input, .form-field select{ width:100%; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:14px; }
  .err{ color:var(--rejected); font-size:12px; margin-top:6px; min-height:16px; }
  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--panel-2); border:1px solid var(--border);
    color:var(--text); padding:9px 16px; border-radius:6px; font-size:13px; z-index:100; opacity:0; pointer-events:none;
    transition:opacity .2s;
  }
  .toast.show{ opacity:1; }

  /* ---- login ---- */
  .login-modal{ width:380px; }
  .role-badge{
    display:flex; align-items:center; gap:8px; padding:6px 10px; border:1px solid var(--border-soft);
    border-radius:6px; background:var(--panel-2); font-size:12.5px;
  }
  .role-badge .dot{ width:7px; height:7px; border-radius:50%; background:var(--approved); }
  .role-badge .rname{ color:var(--text); font-weight:600; }
  .role-badge .ruser{ color:var(--text-dim); }
  .login-note{ font-size:11.5px; color:var(--text-faint); line-height:1.5; margin-top:12px; }
</style>

<div class="overlay modal-overlay open" id="loginOverlay">
  <div class="modal login-modal" id="loginModal"></div>
</div>

  <div class="rail">
    <div class="rail-title">ECU Type</div>
    <div id="rail-ecu"></div>
    <div class="rail-sep"></div>
    <div class="rail-title">Views</div>
    <div class="rail-item" data-view="matrix" id="rail-matrix">Compatibility matrix</div>
    <div class="rail-item" data-view="members" id="rail-members" style="display:none;">Team members</div>
  </div>

<script>
(function(){
  // Claude.ai only injects window.storage when this file is rendered as a live
  // artifact inside a conversation. If it's missing (e.g. the file was downloaded
  // and opened directly, or viewed somewhere else), fall back to an in-memory
  // store so the tool still works for this session \u2014 nothing will persist
  // between reloads, and we surface that clearly instead of crashing.
  let storagePersists = true;
  if(typeof window.storage === 'undefined' || !window.storage){
    storagePersists = false;
    const mem = {};
    window.storage = {
      get: async (k)=> (k in mem) ? {key:k, value:mem[k]} : null,
      set: async (k,v)=> { mem[k]=v; return {key:k, value:v}; },
      delete: async (k)=> { delete mem[k]; return {key:k, deleted:true}; },
      list: async ()=> ({keys:Object.keys(mem)}),
    };
    console.warn("window.storage unavailable \u2014 using in-memory fallback; nothing will be saved after this session.");
  }
  const ECUS = ["VCU","MCU","Display"];
  const VEHICLE_MODELS = [
    "e.1+x_QS_HJ5AEC_SMPL (1.5kW+80A)",
    "e.1+x_QS_HK5APC_SMPL (1.5kW+60A)",
    "e.1x_QS_HK5APC_SMPL (1.1kW+60A)",
    "e.3x_EMF_63S_H222C_SMPL (1.2kW+50A)",
    "e.3x_EMF_63S_H222C_SMPL (0.25kW+30A)",
    "e.1+x_EMF_54S_HK5LPC_SMPL (1.5kW+60A)",
    "e.3x_EMF_63S_H222C_HONDA (0.25kW+30A)",
    "e.3x_EMF_63S_H222C_HONDA (1.2kW+50A)",
    "STAR_EMF_63S_H222C_BatterySmart (0.25kW+30A)",
    "STAR_EMF_63S_H222C_BatterySmart (1.2kW+50A)",
    "e.1x_QS_HK5APC_CE (1.1kW+60A)"
  ];
  const STATUS_LABEL = {draft:"Draft", validation:"In Validation", approved:"Approved", deployed:"Deployed", deprecated:"Deprecated", rejected:"Rejected"};
  const NEXT = {draft:["validation","rejected"], validation:["approved","rejected"], approved:["deployed"], deployed:["deprecated"], deprecated:[], rejected:[]};

  const ROLES = ["Vehicle Integration","Vehicle Testing","Production","Hub Ops"];
  const MEMBER_TEAMS = ["Vehicle Testing","Production","Hub Ops"]; // VI uses real Supabase auth, not this table
  // Every lifecycle transition, plus adding firmware, is restricted to Vehicle Integration.
  // Vehicle Testing, Production, and Hub Ops are view + download only.
  const TRANSITION_ROLE = {
    "draft:validation":   "Vehicle Integration",
    "draft:rejected":     "Vehicle Integration",
    "validation:approved":"Vehicle Integration",
    "validation:rejected":"Vehicle Integration",
    "approved:deployed":  "Vehicle Integration",
    "deployed:deprecated":"Vehicle Integration",
  };
  let currentUser = null; // {name, role}

  const STATUS_FROM_LABEL = Object.fromEntries(Object.entries(STATUS_LABEL).map(([k,v])=>[v.toLowerCase(),k]));

  function parseCSV(text){
    const rows = [];
    let row = [], field = "", inQuotes = false;
    for(let i=0; i<text.length; i++){
      const c = text[i], next = text[i+1];
      if(inQuotes){
        if(c === '"' && next === '"'){ field += '"'; i++; }
        else if(c === '"'){ inQuotes = false; }
        else { field += c; }
      } else {
        if(c === '"'){ inQuotes = true; }
        else if(c === ','){ row.push(field); field = ""; }
        else if(c === '\r'){ /* skip */ }
        else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ""; }
        else { field += c; }
      }
    }
    if(field.length || row.length){ row.push(field); rows.push(row); }
    return rows.filter(r => r.length > 1 || (r.length===1 && r[0].trim()!==""));
  }

  async function handleImportFile(file){
    if(!isRole("Vehicle Integration")){ toast("Only Vehicle Integration can import firmware"); return; }
    const text = await file.text();
    const rows = parseCSV(text);
    if(rows.length===0){ toast("File is empty"); return; }
    const header = rows[0].map(h=>h.trim().toLowerCase());
    const idx = name => header.indexOf(name.toLowerCase());
    const col = { ecu: idx("ECU"), model: idx("Vehicle Model"), version: idx("Version"), status: idx("Status"),
      hwRev: idx("HW Rev"), dbc: idx("DBC Version"), author: idx("Author"), changelog: idx("Changelog"),
      location: idx("Binary Location"), checksum: idx("Checksum"), deployments: idx("Deployment Targets"),
      draftDate: idx("Draft Date"), validationDate: idx("Validation Date"),
      approvedDate: idx("Approved Date"), deployedDate: idx("Deployed Date") };
    if(col.ecu===-1 || col.model===-1 || col.version===-1){
      toast("CSV must have at least ECU, Vehicle Model, and Version columns \u2014 try the Template");
      return;
    }
    // Optional per-stage date columns let an import carry a real backdated workflow history
    // (Draft -> In Validation -> Approved -> Deployed) instead of one flat status as of today.
    const toISO = (v)=>{
      if(!v) return null;
      const d = new Date(v);
      return isNaN(d.getTime()) ? null : d.toISOString();
    };
    const hasStageDates = col.validationDate>-1 || col.approvedDate>-1 || col.deployedDate>-1;
    let added = 0, skipped = 0;
    const now = new Date().toISOString();
    rows.slice(1).forEach(r=>{
      const ecu = (r[col.ecu]||"").trim();
      const model = (r[col.model]||"").trim();
      const version = (r[col.version]||"").trim();
      if(!ecu || !model || !/^\d+\.\d+\.\d+$/.test(version)){ skipped++; return; }
      if(entries.some(e=>e.ecu===ecu && e.platform===model && e.version===version)){ skipped++; return; }
      const deployTargets = col.deployments>-1 && r[col.deployments]
        ? r[col.deployments].split(";").map(s=>s.trim()).filter(Boolean)
        : [];

      let status, history, createdAt;
      if(hasStageDates){
        const draftDate = (col.draftDate>-1 && toISO(r[col.draftDate])) || now;
        const validationDate = col.validationDate>-1 ? toISO(r[col.validationDate]) : null;
        const approvedDate = col.approvedDate>-1 ? toISO(r[col.approvedDate]) : null;
        const deployedDate = col.deployedDate>-1 ? toISO(r[col.deployedDate]) : null;
        createdAt = draftDate;
        history = [{status:"draft", by: currentUser.name, date: draftDate, note:"Imported from CSV"}];
        status = "draft";
        if(validationDate){ history.push({status:"validation", by: currentUser.name, date: validationDate, note:"Imported from CSV"}); status = "validation"; }
        if(approvedDate){ history.push({status:"approved", by: currentUser.name, date: approvedDate, note:"Imported from CSV"}); status = "approved"; }
        if(deployedDate){ history.push({status:"deployed", by: currentUser.name, date: deployedDate, note:"Imported from CSV"}); status = "deployed"; }
      } else {
        const rawStatus = col.status>-1 ? (r[col.status]||"").trim().toLowerCase() : "draft";
        status = STATUS_LABEL[rawStatus] ? rawStatus : (STATUS_FROM_LABEL[rawStatus] || "draft");
        createdAt = now;
        history = [{status, by: currentUser.name, date: now, note: "Imported from CSV"}];
      }

      entries.push({
        id: uid(), ecu, platform: model, version, status,
        hwRev: col.hwRev>-1 ? (r[col.hwRev]||"").trim() : "",
        dbcVersion: col.dbc>-1 ? (r[col.dbc]||"").trim() : "",
        checksum: col.checksum>-1 ? (r[col.checksum]||"").trim() : "",
        author: col.author>-1 ? (r[col.author]||"").trim() : currentUser.name,
        createdAt,
        changelog: col.changelog>-1 ? (r[col.changelog]||"").trim() : "",
        binaryLocation: col.location>-1 ? (r[col.location]||"").trim() : "",
        fileName: "",
        history,
        deployments: deployTargets.map(t=>({target:t, date:now, by:currentUser.name})),
      });
      added++;
    });
    await save();
    renderAll();
    toast(`Imported ${added} entries${skipped ? `, skipped ${skipped}` : ""}`);
  }
  document.getElementById('importCsvBtn').onclick = ()=> document.getElementById('importFileInput').click();
  document.getElementById('importFileInput').addEventListener('change', (ev)=>{
    const file = ev.target.files[0];
    if(file) handleImportFile(file);
    ev.target.value = "";
  });

  document.getElementById('clearAllBtn').onclick = ()=>{
    if(!isRole("Vehicle Integration")) return;
    confirmModal(`Delete all ${entries.length} firmware entries? This cannot be undone.`, async ()=>{
      entries = [];
      await save();
      renderAll();
      toast("All entries cleared");
    });
  };

  function renderAll(){
    renderRail();
    if(currentView === "matrix") renderMatrix();
    else if(currentView === "members") renderMembers();
    else renderList();
  }

  document.getElementById('rail-matrix').onclick = ()=>{ currentView="matrix"; renderAll(); };
  document.getElementById('rail-members').onclick = ()=>{ currentView="members"; renderAll(); };
  document.getElementById('search').addEventListener('input', renderAll);
  document.getElementById('platformFilter').addEventListener('change', renderAll);
  document.getElementById('statusFilter').addEventListener('change', renderAll);

  async function renderMembers(){
    const content = document.getElementById('content');
    content.innerHTML = `<div class="section-title">Team Members</div><div id="membersBody">Loading\u2026</div>`;
    const body = document.getElementById('membersBody');
    const members = await loadMembers();

    const rowsHtml = MEMBER_TEAMS.map(team=>{
      const teamMembers = members.filter(m=>m.team===team);
      const rows = teamMembers.length
        ? teamMembers.map(m=>`
            <tr>
              <td>${m.name}</td>
              <td>${m.email}</td>
              <td class="mono">${m.passkey}</td>
              <td><button class="btn-ghost member-del" data-id="${m.id}" data-name="${m.name}" style="color:var(--rejected);border-color:var(--rejected);">Delete</button></td>
            </tr>`).join('')
        : `<tr><td colspan="4" style="color:var(--text-faint);">No members yet.</td></tr>`;
      return `
        <div style="margin-bottom:28px;">
          <div style="font-weight:600; margin-bottom:8px;">${team}</div>
          <table class="data-table">
            <thead><tr><th>Name</th><th>Email</th><th>Passkey</th><th></th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>`;
    }).join('');

    body.innerHTML = `
      <div style="margin-bottom:28px; padding:14px 16px; border:1px solid var(--border-soft); border-radius:8px; background:var(--panel-2);">
        <div style="font-weight:600; margin-bottom:6px;">Vehicle Integration</div>
        <div style="font-size:12.5px; color:var(--text-faint); margin-bottom:10px; line-height:1.5;">
          These are real Supabase accounts, not passkey members \u2014 this app can create a new one, but it can't list or remove existing ones (that requires admin access this app deliberately doesn't have). To see or revoke a Vehicle Integration account, use the Supabase dashboard: Authentication \u2192 Users.
        </div>
        <button class="btn" id="inviteViBtn">+ Invite Vehicle Integration Member</button>
      </div>
      <div style="margin-bottom:16px;">
        <button class="btn" id="addMemberBtn">+ Add Member</button>
      </div>
      ${rowsHtml}
    `;

    document.getElementById('inviteViBtn').onclick = ()=>{
      const modal = document.getElementById('modal');
      modal.innerHTML = `
        <h2>Invite Vehicle Integration member</h2>
        <div class="form-field">
          <label>Email</label>
          <input type="email" id="iv_email" placeholder="them@bounceshare.com">
        </div>
        <div class="err" id="iv_err"></div>
        <div class="modal-actions">
          <button class="btn-ghost" id="iv_cancel">Cancel</button>
          <button class="btn" id="iv_save">Create account</button>
        </div>
      `;
      document.getElementById('modalOverlay').classList.add('open');
      modal.querySelector('#iv_cancel').onclick = closeModal;
      modal.querySelector('#iv_save').onclick = async ()=>{
        const email = modal.querySelector('#iv_email').value.trim();
        const err = modal.querySelector('#iv_err');
        if(!email){ err.textContent = "Enter an email."; return; }
        const tempPassword = genTempPassword();
        try{
          await supabaseInviteVI(email, tempPassword);
          closeModal();
          toast(`Account created for ${email} \u2014 temp password: ${tempPassword} (copy this now). They must confirm via the email Supabase just sent before they can sign in, and should change this password after their first login.`);
        }catch(e){
          console.error("Invite VI failed", e);
          err.textContent = e.message || "Could not create account \u2014 see console.";
        }
      };
    };

    body.querySelectorAll('.member-del').forEach(btn=>{
      btn.onclick = ()=>{
        const id = btn.dataset.id, name = btn.dataset.name;
        confirmModal(`Remove ${name}? They will no longer be able to sign in \u2014 re-adding them issues a brand new passkey.`, async ()=>{
          try{
            await deleteMember(id);
            toast("Member removed");
            renderMembers();
          }catch(e){
            console.error("Delete member failed", e);
            toast("Could not remove member \u2014 see console");
          }
        });
      };
    });

    document.getElementById('addMemberBtn').onclick = ()=>{
      const modal = document.getElementById('modal');
      modal.innerHTML = `
        <h2>Add team member</h2>
        <div class="form-field" style="margin-bottom:10px;">
          <label>Team</label>
          <select id="am_team">${MEMBER_TEAMS.map(t=>`<option>${t}</option>`).join('')}</select>
        </div>
        <div class="form-field" style="margin-bottom:10px;">
          <label>Name</label>
          <input type="text" id="am_name" placeholder="full name">
        </div>
        <div class="form-field">
          <label>Email</label>
          <input type="email" id="am_email" placeholder="them@bounceshare.com">
        </div>
        <div class="err" id="am_err"></div>
        <div class="modal-actions">
          <button class="btn-ghost" id="am_cancel">Cancel</button>
          <button class="btn" id="am_save">Add \u0026 generate passkey</button>
        </div>
      `;
      document.getElementById('modalOverlay').classList.add('open');
      modal.querySelector('#am_cancel').onclick = closeModal;
      modal.querySelector('#am_save').onclick = async ()=>{
        const team = modal.querySelector('#am_team').value;
        const name = modal.querySelector('#am_name').value.trim();
        const email = modal.querySelector('#am_email').value.trim();
        const err = modal.querySelector('#am_err');
        if(!name || !email){ err.textContent = "Enter a name and email."; return; }
        try{
          const passkey = await addMember(team, name, email);
          closeModal();
          renderMembers();
          toast(`Added ${name} \u2014 passkey: ${passkey} (copy this now, it won't be shown again)`);
        }catch(e){
          console.error("Add member failed", e);
          err.textContent = e.message && e.message.includes("duplicate") ? "That email is already registered for this team." : "Could not add member \u2014 see console.";
        }
      };
    };
  }

  // ---------- Drawer ----------
  function openDrawer(id){
    openId = id;
    const e = visibleEntries().find(x=>x.id===id);
    if(!e) return;
    const drawer = document.getElementById('drawer');
    const nextStates = NEXT[e.status] || [];
    drawer.innerHTML = `
      <button class="close-x" id="closeDrawer">&times;</button>
      <h2>${idFor(e)}</h2>
      <div class="drawer-sub">${e.ecu} &middot; ${e.platform} &middot; <span class="pill ${e.status}">${STATUS_LABEL[e.status]}</span></div>

      <div class="field-row">
        <div class="field">
          <label>Binary location</label>
          <div class="field-static mono" style="word-break:break-all;">${
            e.binaryLocation
              ? (/^https?:\/\//i.test(e.binaryLocation)
                  ? `<a href="${e.binaryLocation}" target="_blank" rel="noopener" style="color:var(--deployed);">${e.binaryLocation}</a>`
                  : e.binaryLocation)
              : "\u2014"
          }</div>
        </div>
      </div>
      <div class="field-row">
        <div class="field"><label>Checksum (SHA-256)</label><div class="field-static mono" style="font-size:11px;">${e.checksum || "\u2014"}</div></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Author</label><div class="field-static">${e.author || "\u2014"}</div></div>
      </div>
      <div class="field">
        <label>Changelog</label>
        <div class="field-static dim">${e.changelog || "\u2014"}</div>
      </div>

      <div class="divider"></div>
      <div class="section-title">Advance workflow</div>
      <div class="action-row" id="workflowActions"></div>

      <div class="divider"></div>
      <div class="section-title">Deployment targets (${e.deployments.length})</div>
      <div id="deployList"></div>
      ${isRole("Vehicle Integration") ? `
      <div class="action-row" style="margin-top:10px;">
        <input type="text" id="deployTarget" placeholder="Vehicle / fleet batch ID" style="flex:1;">
        <button class="btn-ghost" id="addDeployBtn">Log deployment</button>
      </div>` : `<div class="faint" style="font-size:12px; margin-top:8px;">Logging deployments requires Vehicle Integration.</div>`}

      <div class="divider"></div>
      <div class="section-title">History</div>
      <div id="historyList"></div>

      ${isRole("Vehicle Integration") ? `
      <div class="divider"></div>
      <button class="btn-ghost" id="deleteEntryBtn" style="color:var(--rejected); border-color:var(--rejected);">Delete entry</button>
      ` : ''}
    `;

    // workflow buttons
    const wfDiv = drawer.querySelector('#workflowActions');
    const allowedNext = nextStates.filter(ns=>canTransition(e.status, ns));
    const blockedNext = nextStates.filter(ns=>!canTransition(e.status, ns));
    if(nextStates.length===0){
      wfDiv.innerHTML = `<span class="faint">No further transitions from ${STATUS_LABEL[e.status]}.</span>`;
    } else {
      allowedNext.forEach(ns=>{
        const b = document.createElement('button');
        b.className = 'btn-ghost';
        b.textContent = `\u2192 ${STATUS_LABEL[ns]}`;
        b.onclick = ()=> promptTransition(e, ns);
        wfDiv.appendChild(b);
      });
      if(blockedNext.length){
        const note = document.createElement('div');
        note.className = 'faint';
        note.style.cssText = 'font-size:12px; margin-top:6px; width:100%;';
        note.textContent = blockedNext.map(ns=>`${STATUS_LABEL[ns]} requires ${roleFor(e.status, ns)}`).join(' \u00b7 ');
        wfDiv.appendChild(note);
      }
    }

    // deployments
    const dl = drawer.querySelector('#deployList');
    dl.innerHTML = e.deployments.length
      ? e.deployments.map(d=>`<div class="deploy-item"><span class="mono">${d.target}</span><span class="dim">${fmtDate(d.date)}</span></div>`).join('')
      : `<span class="faint">No deployments logged yet.</span>`;
    drawer.querySelector('#addDeployBtn')?.addEventListener('click', async ()=>{
      const val = drawer.querySelector('#deployTarget').value.trim();
      if(!val) return;
      e.deployments.push({target:val, date:new Date().toISOString(), by: currentUser.name});
      await save();
      openDrawer(id);
      renderAll();
      toast("Deployment logged");
    });

    // history
    const hl = drawer.querySelector('#historyList');
    const hist = e.history.slice().reverse();
    hl.innerHTML = hist.map(h=>`
      <div class="history-item">
        <div class="history-top"><span class="pill ${h.status}">${STATUS_LABEL[h.status]}</span><span>${fmtDateTime(h.date)}</span></div>
        ${h.note ? `<div class="history-note">${h.note}</div>` : ''}
      </div>`).join('');

    drawer.querySelector('#closeDrawer').onclick = closeDrawer;
    drawer.querySelector('#deleteEntryBtn')?.addEventListener('click', ()=>{
      confirmModal(`Delete ${idFor(e)}? This cannot be undone.`, async ()=>{
        entries = entries.filter(x=>x.id!==e.id);
        await save();
        closeDrawer();
        renderAll();
        toast("Entry deleted");
      });
    });

    document.getElementById('drawerOverlay').classList.add('open');
  }
  function closeDrawer(){
    document.getElementById('drawerOverlay').classList.remove('open');
    openId = null;
  }
  document.getElementById('drawerOverlay').addEventListener('click', (ev)=>{
    if(ev.target.id === 'drawerOverlay') closeDrawer();
  });

  function confirmModal(message, onConfirm){
    const modal = document.getElementById('modal');
    modal.innerHTML = `
      <h2>Are you sure?</h2>
      <div class="field-static" style="margin-bottom:16px; line-height:1.5;">${message}</div>
      <div class="modal-actions">
        <button class="btn-ghost" id="cancelModal">Cancel</button>
        <button class="btn" id="confirmModalBtn" style="background:var(--rejected); color:#fff;">Delete</button>
      </div>
    `;
    document.getElementById('modalOverlay').classList.add('open');
    modal.querySelector('#cancelModal').onclick = closeModal;
    modal.querySelector('#confirmModalBtn').onclick = ()=>{
      closeModal();
      onConfirm();
    };
  }

  function toLocalDatetimeInputValue(d){
    const pad = n => String(n).padStart(2,'0');
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }
  function promptTransition(e, newStatus){
    if(!canTransition(e.status, newStatus)) return;
    const modal = document.getElementById('modal');
    modal.innerHTML = `
      <h2>Move to ${STATUS_LABEL[newStatus]}</h2>
      <div class="form-field" style="margin-bottom:10px;">
        <label>When did this happen?</label>
        <input type="datetime-local" id="t_date" value="${toLocalDatetimeInputValue(new Date())}">
        <div class="faint" style="font-size:11px; margin-top:5px;">Defaults to now \u2014 change it to backdate this transition (e.g. logging something that already happened).</div>
      </div>
      <div class="form-field">
        <label>Note (optional)</label>
        <textarea id="t_note" placeholder="e.g. passed bench test, failed thermal check"></textarea>
      </div>
      <div class="err" id="t_err"></div>
      <div class="modal-actions">
        <button class="btn-ghost" id="cancelModal">Cancel</button>
        <button class="btn" id="t_submit">Confirm move</button>
      </div>
    `;
    document.getElementById('modalOverlay').classList.add('open');
    modal.querySelector('#cancelModal').onclick = closeModal;
    modal.querySelector('#t_submit').onclick = ()=>{
      const dateVal = modal.querySelector('#t_date').value;
      const err = modal.querySelector('#t_err');
      if(!dateVal){ err.textContent = "Pick a date and time."; return; }
      const iso = new Date(dateVal).toISOString();
      const note = modal.querySelector('#t_note').value.trim();
      e.status = newStatus;
      e.history.push({status:newStatus, by: currentUser.name, date: iso, note});
      save().then(()=>{
        closeModal();
        openDrawer(e.id);
        renderAll();
        toast(`Moved to ${STATUS_LABEL[newStatus]}`);
      });
    };
  }

  // ---------- New firmware modal ----------
  function openModal(){
    if(!isRole("Vehicle Integration")){ toast("Only Vehicle Integration can register new firmware"); return; }
    const modal = document.getElementById('modal');
    modal.innerHTML = `
      <h2>Register new firmware</h2>
      <div class="form-grid">
        <div class="form-field"><label>ECU type</label>
          <select id="f_ecu">${ECUS.map(x=>`<option>${x}</option>`).join('')}</select>
        </div>
        <div class="form-field full"><label>Vehicle Model</label>
          <select id="f_platform">${VEHICLE_MODELS.map(x=>`<option>${x}</option>`).join('')}</select>
        </div>
        <div class="form-field full"><label>Version (Major.Minor.Patch)</label>
          <div style="display:flex; gap:6px; align-items:center;">
            <select id="f_major" style="flex:1;">${Array.from({length:10},(_,n)=>n).map(n=>`<option value="${n}">${n}</option>`).join('')}</select>
            <span class="dim">.</span>
            <select id="f_minor" style="flex:1;">${Array.from({length:21},(_,n)=>n).map(n=>`<option value="${n}">${n}</option>`).join('')}</select>
            <span class="dim">.</span>
            <select id="f_patch" style="flex:1;">${Array.from({length:21},(_,n)=>n).map(n=>`<option value="${n}">${n}</option>`).join('')}</select>
          </div>
        </div>
        <div class="form-field"><label>Hardware rev</label>
          <select id="f_hwrev_select">
            <option value="">\u2014 select \u2014</option>
            ${["Rev A","Rev B","Rev C","Rev D","Rev E","Rev F","Rev G","Rev H","Rev I","Rev J"].map(r=>`<option>${r}</option>`).join('')}
            <option value="__other__">Other (type manually)</option>
          </select>
          <input type="text" id="f_hwrev_other" placeholder="Enter custom hardware rev" style="display:none; margin-top:6px;">
        </div>
        <div class="form-field"><label>DBC version (if CAN)</label>
          <input type="text" id="f_dbc" placeholder="optional">
        </div>
        <div class="form-field"><label>Author</label>
          <input type="text" id="f_author" placeholder="your name" value="${currentUser ? currentUser.name : ''}">
        </div>
        <div class="form-field full"><label>Binary location (URL or path \u2014 e.g. a shared drive link)</label>
          <input type="text" id="f_location" placeholder="e.g. https://drive.google.com/file/d/.../view or \\\\fileserver\\fw\\vcu\\2.3.1.bin">
        </div>
        <div class="form-field full"><label>Checksum (SHA-256)</label>
          <input type="text" id="f_checksum" placeholder="optional \u2014 enter manually if known">
        </div>
        <div class="form-field full"><label>Changelog</label>
          <textarea id="f_changelog" placeholder="What changed, and why"></textarea>
        </div>
      </div>
      <div class="err" id="f_err"></div>
      <div class="modal-actions">
        <button class="btn-ghost" id="cancelModal">Cancel</button>
        <button class="btn" id="saveModal">Register as Draft</button>
      </div>
    `;
    document.getElementById('modalOverlay').classList.add('open');
    modal.querySelector('#cancelModal').onclick = closeModal;
    modal.querySelector('#saveModal').onclick = submitNewFirmware;
    const hwSel = modal.querySelector('#f_hwrev_select');
    const hwOther = modal.querySelector('#f_hwrev_other');
    hwSel.onchange = ()=>{
      hwOther.style.display = hwSel.value === "__other__" ? "" : "none";
    };
  }
  function closeModal(){ document.getElementById('modalOverlay').classList.remove('open'); }
  document.getElementById('modalOverlay').addEventListener('click', (ev)=>{
    if(ev.target.id === 'modalOverlay') closeModal();
  });

  async function submitNewFirmware(){
    const ecu = document.getElementById('f_ecu').value;
    const platform = document.getElementById('f_platform').value;
    const major = document.getElementById('f_major').value;
    const minor = document.getElementById('f_minor').value;
    const patch = document.getElementById('f_patch').value;
    const version = `${major}.${minor}.${patch}`;
    const hwSelVal = document.getElementById('f_hwrev_select').value;
    const hwRev = hwSelVal === "__other__" ? document.getElementById('f_hwrev_other').value.trim() : hwSelVal;
    const dbcVersion = document.getElementById('f_dbc').value.trim();
    const author = document.getElementById('f_author').value.trim();
    const checksum = document.getElementById('f_checksum').value.trim();
    const binaryLocation = document.getElementById('f_location').value.trim();
    const changelog = document.getElementById('f_changelog').value.trim();
    const err = document.getElementById('f_err');

    if(entries.some(e=>e.ecu===ecu && e.platform===platform && e.version===version)){
      err.textContent = "This ECU + platform + version already exists in the registry.";
      return;
    }
    const now = new Date().toISOString();
    entries.push({
      id: uid(), ecu, platform, version, status:"draft",
      hwRev, dbcVersion, checksum, author, createdAt: now, changelog,
      binaryLocation,
      history:[{status:"draft", by: currentUser.name, date:now, note:"Registered"}],
      deployments: []
    });
    await save();
    closeModal();
    renderAll();
    toast("Firmware registered as Draft");
  }

  document.getElementById('newFwBtn').onclick = ()=>openModal();

  // ---------- init ----------
  function populateVehicleModelFilter(){
    const sel = document.getElementById('platformFilter');
    VEHICLE_MODELS.forEach(m=>{
      const opt = document.createElement('option');
      opt.value = m; opt.textContent = m;
      sel.appendChild(opt);
    });
  }
  populateVehicleModelFilter();
  document.getElementById('newFwBtn').style.display = "none";
  document.getElementById('importCsvBtn').style.display = "none";
  document.getElementById('clearAllBtn').style.display = "none";
  renderLoginGate();
  if(!storagePersists){
    console.warn("Persistent storage is unavailable in this view \u2014 changes will not be saved after this session.");
  }
  load().then(renderAll);
})();
</script>

</body>
</html>
